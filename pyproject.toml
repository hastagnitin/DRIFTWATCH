[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "driftwatch-cli"
version = "0.1.0"
description = "CLI tool that detects Terraform infrastructure drift against live AWS, explains it with AI, and guides remediation."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Nitin Gupta"}
]
keywords = ["terraform", "aws", "drift-detection", "iac", "devops", "cloud-security", "remediation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34.0",
    "typer>=0.9.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "moto[all]>=5.0.0",
    "build",
    "twine"
]

[project.urls]
Homepage = "https://github.com/hastagnitin/driftwatch"
Repository = "https://github.com/hastagnitin/driftwatch"

[project.scripts]
driftwatch = "driftwatch.cli:app"

[tool.setuptools.packages.find]
include = ["driftwatch*", "drift_engine*"]