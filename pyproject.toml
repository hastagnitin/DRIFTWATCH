[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "driftwatch-cli"
version = "3.0.3"
description = "Detect Terraform infrastructure drift against live AWS, explain risk with AI, and remediate — terraform drift detection, aws infrastructure drift, iac drift monitoring."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Nitin Gupta"}
]
keywords = ["terraform", "aws", "drift-detection", "iac", "devops", "cloud-security", "remediation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34.0",
    "typer>=0.9.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "moto[all]>=5.0.0",
    "build",
    "twine",
    "ruff>=0.1.0",
    "bandit>=1.7.0",
    "mypy>=1.5.0",
    "pip-audit>=2.6.0"
]


[project.urls]
Homepage = "https://github.com/hastagnitin/driftwatch"
Repository = "https://github.com/hastagnitin/driftwatch"

[project.scripts]
driftwatch = "driftwatch.cli:app"

[tool.setuptools.packages.find]
include = ["driftwatch*", "drift_engine*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]