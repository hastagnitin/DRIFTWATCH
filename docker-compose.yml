services:
  db:
    image: postgres:15-alpine
    container_name: driftwatch-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - driftwatch_db_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: driftwatch-app
    depends_on:
      - db
    stdin_open: true
    tty: true
    env_file:
      - .env
    volumes:
      - ./terraform:/app/terraform:rw

volumes:
  driftwatch_db_data: