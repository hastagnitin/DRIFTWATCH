name: DriftWatch CI Gatekeeper

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  security-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Infrastructure Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Local Source and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Test Suite
        run: |
          pytest tests/ -v --cov=drift_engine --cov=driftwatch --cov-report=xml

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Fetch Terraform State from S3
        env:
          TF_STATE_BUCKET_NAME: ${{ secrets.TF_STATE_BUCKET_NAME }}
        run: |
          if [ -z "$TF_STATE_BUCKET_NAME" ]; then
            echo "Error: TF_STATE_BUCKET_NAME secret is not set"
            exit 1
          fi
          mkdir -p terraform
          aws s3 cp "s3://${TF_STATE_BUCKET_NAME}/terraform.tfstate" terraform/terraform.tfstate

      - name: Enforce Drift Zero-Tolerance Policy
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          driftwatch scan --region ${{ secrets.AWS_REGION }} --fail-on CRITICAL