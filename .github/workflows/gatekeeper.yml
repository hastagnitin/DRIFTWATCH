name: DriftWatch CI Gatekeeper

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  security-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Infrastructure Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install DriftWatch CLI
        run: |
          python -m pip install --upgrade pip
          pip install driftwatch-cli

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Fetch Terraform State from S3
        run: |
          mkdir -p terraform
          aws s3 cp s3://driftwatch-state-nitin-007/terraform.tfstate terraform/terraform.tfstate

      - name: Enforce Drift Zero-Tolerance Policy
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          driftwatch scan --region ap-south-1 --fail-on CRITICAL