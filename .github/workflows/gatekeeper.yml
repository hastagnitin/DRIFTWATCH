name: DriftWatch CI Gatekeeper

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  security-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Infrastructure Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Local Source and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check drift_engine/ driftwatch/

      - name: Security Vulnerability Scan (Bandit)
        run: |
          bandit -r drift_engine/ driftwatch/ -ll -i

      - name: Dependency Security Audit (pip-audit)
        run: |
          pip-audit

      - name: Run Test Suite & Coverage
        run: |
          pytest tests/ -v --cov=drift_engine --cov=driftwatch --cov-report=xml

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Enforce Drift Zero-Tolerance Policy (Direct S3 State Support)
        env:
          TF_STATE_BUCKET_NAME: ${{ secrets.TF_STATE_BUCKET_NAME }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATE_ARG="terraform/terraform.tfstate"
          if [ -n "$TF_STATE_BUCKET_NAME" ]; then
            STATE_ARG="s3://${TF_STATE_BUCKET_NAME}/terraform.tfstate"
          fi
          driftwatch scan --region ${{ secrets.AWS_REGION }} --state "${STATE_ARG}" --fail-on CRITICAL