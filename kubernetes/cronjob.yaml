apiVersion: batch/v1
kind: CronJob
metadata:
  name: driftwatch-cronjob
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          dnsPolicy: ClusterFirst
          containers:
          - name: driftwatch-engine
            image: driftwatch:latest
            imagePullPolicy: IfNotPresent
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                - ALL
            command:
            - "driftwatch"
            - "scan"
            - "--region"
            - "ap-south-1"
            - "--state"
            - "/state/terraform.tfstate"
            - "--fail-on"
            - "CRITICAL"
            envFrom:
            - secretRef:
                name: driftwatch-env
            volumeMounts:
            - name: terraform-state
              mountPath: /state
              readOnly: true
          restartPolicy: OnFailure
          volumes:
          - name: terraform-state
            # Option 1: Use a PVC containing the Terraform state file
            persistentVolumeClaim:
              claimName: driftwatch-tfstate
            # Option 2: Use an S3 state URI instead of a local file:
            #   Remove the volume/volumeMount above and change --state to:
            #   - "s3://your-bucket/path/to/terraform.tfstate"